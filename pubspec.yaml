name: shopsnap
description: Shopping Tracker — Offline-first với Cloud Sync
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Image
  image_picker: ^1.1.2
  image: ^4.1.7

  # Phase 3 — Barcode & OCR
  mobile_scanner: ^5.2.3
  google_mlkit_text_recognition: ^0.13.1
  camera: ^0.10.5+9
  http: ^1.2.1

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0

  # Notifications
  flutter_local_notifications: ^17.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
